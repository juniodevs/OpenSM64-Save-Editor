<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="starGrad" x1="50" y1="2" x2="50" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#fff875"/>
      <stop offset="45%" stopColor="#ffd800"/>
      <stop offset="100%" stopColor="#e69d00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Borda 3D Externa -->
  <polygon
    points="50,4 63,33 96,36 71,59 78,92 50,75 22,92 29,59 4,36 37,33"
    fill="#875800"
    stroke="#1a1100"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Corpo Dourado da Estrela -->
  <polygon
    points="50,7 62,34 92,37 69,58 75,89 50,73 25,89 31,58 8,37 38,34"
    fill="url(#starGrad)"
    stroke="#ffeea8"
    stroke-width="1.5"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Olho Esquerdo (Oval Preto com Brilho) -->
  <ellipse cx="43" cy="51" rx="4" ry="9.5" fill="#111111"/>
  <ellipse cx="42" cy="47" rx="1.5" ry="3.5" fill="#ffffff"/>

  <!-- Olho Direito (Oval Preto com Brilho) -->
  <ellipse cx="57" cy="51" rx="4" ry="9.5" fill="#111111"/>
  <ellipse cx="56" cy="47" rx="1.5" ry="3.5" fill="#ffffff"/>
</svg>